name: Buildino Runner WF-6

run-name: "Buildino WF-6 • ${{ inputs.build_target }} • ${{ inputs.request_id }}"

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Random Buildino request identifier
        required: true
        type: string
      build_target:
        description: apk, aab, or both
        required: true
        type: string
      worker_url:
        description: Buildino Worker public origin
        required: true
        type: string

permissions: {}

concurrency:
  group: buildino-runner-wf6-${{ inputs.request_id }}
  cancel-in-progress: false

env:
  OIDC_AUDIENCE: buildino-worker-v0.4
  MAX_SOURCE_BYTES: "524288000"

jobs:
  build:
    name: Authenticated intake and isolated Flutter build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: write
      id-token: write
    outputs:
      handoff_cache_key: ${{ steps.meta.outputs.handoff_cache_key }}

    steps:
      - name: Checkout trusted Runner template without credentials
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate dispatch inputs
        shell: bash
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          BUILD_TARGET: ${{ inputs.build_target }}
          WORKER_URL: ${{ inputs.worker_url }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import os, re
          from urllib.parse import urlparse

          request_id = os.environ["REQUEST_ID"]
          target = os.environ["BUILD_TARGET"]
          worker = urlparse(os.environ["WORKER_URL"])

          if not re.fullmatch(r"b[0-9]+-[0-9]+-[a-f0-9]{10}", request_id):
              raise SystemExit("Invalid request_id")
          if target not in {"apk", "aab", "both"}:
              raise SystemExit("Invalid build_target")
          if worker.scheme != "https" or not worker.netloc or worker.username or worker.password:
              raise SystemExit("Invalid worker_url")
          PY

      - name: Create temporary result handoff key
        id: meta
        shell: bash
        env:
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -Eeuo pipefail
          echo "handoff_cache_key=buildino-handoff-wf6-${GITHUB_RUN_ID}-${REQUEST_ID}" >> "$GITHUB_OUTPUT"

      - name: Download source through authenticated Worker stream
        id: source_intake
        continue-on-error: true
        shell: bash
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          WORKER_URL: ${{ inputs.worker_url }}
        run: |
          set -Eeuo pipefail
          set +x
          mkdir -p incoming handoff/logs

          get_oidc() {
            curl --fail-with-body --silent --show-error --retry 3 \
              --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])'
          }

          post_progress() {
            local stage="$1"
            local token payload
            token="$(get_oidc)"
            payload="$(python3 - "$REQUEST_ID" "$stage" <<'PY'
          import json,sys
          print(json.dumps({"request_id":sys.argv[1],"stage":sys.argv[2]}, separators=(",",":")))
          PY
          )"
            curl --fail-with-body --silent --show-error --retry 3 \
              --request POST \
              --header "Authorization: Bearer ${token}" \
              --header 'content-type: application/json' \
              --data "$payload" \
              "${WORKER_URL%/}/internal/progress" >/dev/null
          }

          post_progress intake
          token="$(get_oidc)"
          curl --fail-with-body --location --silent --show-error --retry 3 \
            --connect-timeout 20 --max-time 1200 \
            --max-filesize "$MAX_SOURCE_BYTES" \
            --header "Authorization: Bearer ${token}" \
            --output incoming/source.zip \
            "${WORKER_URL%/}/internal/source/${REQUEST_ID}"
          test -s incoming/source.zip
          post_progress validating
          python3 scripts/validate_zip.py incoming/source.zip 2>&1 | tee handoff/logs/source-validation.log
          sha256sum incoming/source.zip | tee handoff/logs/source-sha256.txt

      - name: Set up Java 17
        id: java
        if: ${{ steps.source_intake.outcome == 'success' }}
        continue-on-error: true
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter stable
        id: flutter
        if: ${{ steps.source_intake.outcome == 'success' }}
        continue-on-error: true
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Mark Build stage
        if: ${{ steps.source_intake.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          WORKER_URL: ${{ inputs.worker_url }}
        run: |
          set -Eeuo pipefail
          set +x
          token="$(
            curl --fail-with-body --silent --show-error --retry 3 \
              --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])'
          )"
          payload="$(python3 - "$REQUEST_ID" <<'PY'
          import json,sys
          print(json.dumps({"request_id":sys.argv[1],"stage":"building"}, separators=(",",":")))
          PY
          )"
          curl --fail-with-body --silent --show-error --retry 3 \
            --request POST \
            --header "Authorization: Bearer ${token}" \
            --header 'content-type: application/json' \
            --data "$payload" \
            "${WORKER_URL%/}/internal/progress" >/dev/null

      - name: Build requested output with OIDC variables removed
        id: build_process
        if: ${{ steps.source_intake.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          SOURCE_ZIP: incoming/source.zip
          BUILD_TARGET: ${{ inputs.build_target }}
          REQUEST_ID: ${{ inputs.request_id }}
          JAVA_SETUP_OUTCOME: ${{ steps.java.outcome }}
          FLUTTER_SETUP_OUTCOME: ${{ steps.flutter.outcome }}
          PUB_CACHE: ${{ runner.temp }}/pub-cache
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false
        run: |
          set -Eeuo pipefail
          unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          bash scripts/run_flutter_build.sh

      - name: Ensure trusted handoff status exists
        if: ${{ always() }}
        shell: bash
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          BUILD_TARGET: ${{ inputs.build_target }}
          SOURCE_OUTCOME: ${{ steps.source_intake.outcome }}
          JAVA_OUTCOME: ${{ steps.java.outcome }}
          FLUTTER_OUTCOME: ${{ steps.flutter.outcome }}
          BUILD_OUTCOME: ${{ steps.build_process.outcome }}
        run: |
          set -Eeuo pipefail
          mkdir -p handoff/result
          if [ ! -s handoff/status.json ]; then
            python3 - <<'PY'
          import json, os
          from pathlib import Path

          source = os.environ.get("SOURCE_OUTCOME", "skipped")
          java = os.environ.get("JAVA_OUTCOME", "skipped")
          flutter = os.environ.get("FLUTTER_OUTCOME", "skipped")
          build = os.environ.get("BUILD_OUTCOME", "skipped")
          if source != "success":
              stage, kind, code = "source_intake", "user", 41
          elif java != "success":
              stage, kind, code = "java_setup", "infrastructure", 42
          elif flutter != "success":
              stage, kind, code = "flutter_setup", "infrastructure", 43
          elif build != "success":
              stage, kind, code = "runner_execution", "infrastructure", 99
          else:
              stage, kind, code = "runner_interrupted", "infrastructure", 100
          Path("handoff/status.json").write_text(json.dumps({
              "status": "failure",
              "failure_stage": stage,
              "failure_kind": kind,
              "failure_code": code,
              "request_id": os.environ["REQUEST_ID"],
              "target": os.environ["BUILD_TARGET"],
              "outputs": [],
              "source_outcome": source,
              "java_outcome": java,
              "flutter_outcome": flutter,
              "build_outcome": build,
          }, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          fi

          # Only public deliverables and the minimal status cross the job boundary.
          rm -rf handoff/logs

      - name: Save result handoff in temporary Actions Cache
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: handoff
          key: ${{ steps.meta.outputs.handoff_cache_key }}

  publish:
    name: Trusted temporary Release publication
    needs: build
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
      id-token: write

    steps:
      - name: Restore build handoff
        id: restore_handoff
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: handoff
          key: buildino-handoff-wf6-${{ github.run_id }}-${{ inputs.request_id }}
          fail-on-cache-miss: false

      - name: Ensure publish handoff exists
        shell: bash
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          BUILD_TARGET: ${{ inputs.build_target }}
          BUILD_JOB_RESULT: ${{ needs.build.result }}
          RESTORE_OUTCOME: ${{ steps.restore_handoff.outcome }}
        run: |
          set -Eeuo pipefail
          mkdir -p handoff/result
          if [ ! -s handoff/status.json ]; then
            python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path("handoff/status.json").write_text(json.dumps({
              "status": "failure",
              "failure_stage": "handoff_missing",
              "failure_kind": "infrastructure",
              "failure_code": 98,
              "request_id": os.environ["REQUEST_ID"],
              "target": os.environ["BUILD_TARGET"],
              "outputs": [],
              "build_job_result": os.environ["BUILD_JOB_RESULT"],
              "restore_outcome": os.environ["RESTORE_OUTCOME"],
          }, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          fi

      - name: Mark publication stage
        continue-on-error: true
        shell: bash
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          WORKER_URL: ${{ inputs.worker_url }}
        run: |
          set -Eeuo pipefail
          set +x
          token="$(
            curl --fail-with-body --silent --show-error --retry 3 \
              --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])'
          )"
          payload="$(python3 - "$REQUEST_ID" <<'PY'
          import json,sys
          print(json.dumps({"request_id":sys.argv[1],"stage":"publishing"}, separators=(",",":")))
          PY
          )"
          curl --fail-with-body --silent --show-error --retry 3 \
            --request POST \
            --header "Authorization: Bearer ${token}" \
            --header 'content-type: application/json' \
            --data "$payload" \
            "${WORKER_URL%/}/internal/progress" >/dev/null

      - name: Create temporary Release and result payload
        id: prepare_result
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -Eeuo pipefail
          set +x
          status="$(python3 -c 'import json; print(json.load(open("handoff/status.json"))["status"])')"
          failure_stage="$(python3 -c 'import json; print(json.load(open("handoff/status.json")).get("failure_stage","unknown"))')"
          failure_kind="$(python3 -c 'import json; print(json.load(open("handoff/status.json")).get("failure_kind","user"))')"
          tag="buildino-${REQUEST_ID}"

          if [ "$status" = "success" ]; then
            mapfile -t files < <(find handoff/result -maxdepth 1 -type f \( -name '*.apk' -o -name '*.aab' \) -size +0c | sort)
            if [ "${#files[@]}" -eq 0 ]; then
              echo "No output file found in handoff." >&2
              exit 1
            fi
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes >/dev/null 2>&1 || true
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Buildino temporary output" \
              --notes "Temporary Buildino output. Automatically deleted after approximately 12 hours." \
              "${files[@]}"

            gh api "/repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" > release.json
            python3 - "$REQUEST_ID" "$tag" > result.json <<'PY'
          import hashlib, json, sys
          from pathlib import Path

          request_id, tag = sys.argv[1:]
          release = json.loads(Path("release.json").read_text(encoding="utf-8"))
          by_name = {asset["name"]: asset for asset in release.get("assets", [])}
          assets = []
          for path in sorted(Path("handoff/result").iterdir()):
              if path.suffix not in {".apk", ".aab"} or not path.is_file():
                  continue
              remote = by_name.get(path.name)
              if not remote:
                  raise SystemExit(f"Release asset missing: {path.name}")
              assets.append({
                  "type": path.suffix[1:],
                  "name": path.name,
                  "url": remote["browser_download_url"],
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  "size": path.stat().st_size,
              })
          print(json.dumps({
              "request_id": request_id,
              "status": "success",
              "release_tag": tag,
              "quota_action": "consume",
              "assets": assets,
          }, ensure_ascii=False, separators=(",",":")))
          PY
          else
            quota_action="consume"
            if [ "$failure_kind" = "infrastructure" ]; then quota_action="release"; fi
            python3 - "$REQUEST_ID" "$failure_stage" "$quota_action" > result.json <<'PY'
          import json,sys
          request_id, stage, quota_action = sys.argv[1:]
          print(json.dumps({
              "request_id": request_id,
              "status": "failure",
              "error_summary": f"Build در مرحله {stage} ناموفق بود. جزئیات در Workflow Run ثبت شده است.",
              "quota_action": quota_action,
              "assets": [],
          }, ensure_ascii=False, separators=(",",":")))
          PY
          fi

      - name: Create infrastructure fallback result
        if: ${{ always() }}
        shell: bash
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          PREPARE_OUTCOME: ${{ steps.prepare_result.outcome }}
        run: |
          set -Eeuo pipefail
          if [ ! -s result.json ]; then
            python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path("result.json").write_text(json.dumps({
              "request_id": os.environ["REQUEST_ID"],
              "status": "failure",
              "error_summary": "انتشار خروجی در GitHub Release ناموفق بود.",
              "quota_action": "release",
              "assets": [],
              "publish_outcome": os.environ.get("PREPARE_OUTCOME", "unknown"),
          }, ensure_ascii=False, separators=(",",":")), encoding="utf-8")
          PY
          fi

      - name: Send final result to Buildino
        if: ${{ always() }}
        shell: bash
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          WORKER_URL: ${{ inputs.worker_url }}
        run: |
          set -Eeuo pipefail
          set +x
          token="$(
            curl --fail-with-body --silent --show-error --retry 3 \
              --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])'
          )"
          curl --fail-with-body --silent --show-error --retry 5 \
            --request POST \
            --header "Authorization: Bearer ${token}" \
            --header 'content-type: application/json' \
            --data-binary @result.json \
            "${WORKER_URL%/}/internal/result" >/dev/null

      - name: Delete temporary handoff cache
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HANDOFF_KEY: buildino-handoff-wf6-${{ github.run_id }}-${{ inputs.request_id }}
        run: |
          set -Eeuo pipefail
          encoded="$(python3 - "$HANDOFF_KEY" <<'PY'
          import sys, urllib.parse
          print(urllib.parse.quote(sys.argv[1], safe=""))
          PY
          )"
          gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/caches?key=${encoded}" >/dev/null 2>&1 || true

      - name: Build summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "## Buildino Runner WF-6"
            echo
            echo "- Request: ${{ inputs.request_id }}"
            echo "- Target: ${{ inputs.build_target }}"
            echo "- Source transfer: authenticated GitHub OIDC stream"
            echo "- Source cache: not used"
            echo "- Release retention: approximately 12 hours"
            echo "- Actions Artifact: not used"
          } >> "$GITHUB_STEP_SUMMARY"
